apply plugin: 'com.android.application'

ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86":3, "x86_64":4]
ext.universalBase = 8000

android {
    namespace 'is.xyz.mpv'
    compileSdk = 36

    // IranSans mod: exclude duplicate KMP metadata files from packaging
    packaging {
        resources {
            excludes += "commonMain/default/manifest"
            excludes += "commonMain/default/linkdata/**"
            excludes += "**/*.knm"
            excludes += "META-INF/kotlin-project-structure-metadata.json"
        }
    }

    defaultConfig {
        minSdkVersion 23
        targetSdk 36

        // Side-by-side with upstream: distinct app id so both can be installed
        applicationId "is.xyz.mpv.iransans"

        versionCode 48
        versionName "2026-09-17-release"

        vectorDrawables.useSupportLibrary = true

        // Load information about the NDK to use
        def props = new Properties()
        def propfile = new File(rootDir, 'ndk.properties')
        if (propfile.exists())
            props.load(new FileInputStream(propfile))
        ndkVersion = props.getProperty('ndkVersion', '')
        ndkPath = props.getProperty('ndkRoot', '')
    }

    flavorDimensions "default"
    productFlavors {
        "default" {
            isDefault true
        }
        allstorage {
            versionNameSuffix "-allstorage"
            minSdkVersion 30
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    splits {
        abi {
            // workaround: AGP fails to build split APKs and a bundle at the same time
            enable !gradle.startParameter.taskNames.any { it.startsWith("bundle") }

            reset()
            // include only the ABIs that were actually built
            project.ext.abiCodes.each { abi, _ ->
                if (new File(project.projectDir, "src/main/jniLibs/${abi}").exists())
                    include(abi)
            }
            universalApk true // build an APK with all ABIs too
        }
    }
}

// Map versionCode so each ABI gets a different one
// e.g. x86 with version 21 gets a versionCode of 3021
import com.android.build.api.variant.FilterConfiguration
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def abiName = output.filters.find { it.filterType == FilterConfiguration.FilterType.ABI }?.identifier
            def base = project.ext.abiCodes[abiName]
            // universal APK just gets a constant added to it
            if (base != null)
                output.versionCode.set(output.versionCode.get() + base * 1000)
            else
                output.versionCode.set(output.versionCode.get() + project.ext.universalBase)
        }
    }
}

dependencies {
    // IranSans mod: exclude old androidx artifacts that cause duplicate classes
    // (local mirror confuses Gradle's conflict resolution)
    configurations.all {
        exclude group: 'androidx.activity', module: 'activity-ktx'
        exclude group: 'androidx.collection', module: 'collection-ktx'
        exclude group: 'androidx.lifecycle', module: 'lifecycle-viewmodel-ktx'
        exclude group: 'androidx.lifecycle', module: 'lifecycle-runtime-ktx'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.android.material:material:1.14.0'
}
